[package]
name = "megalodon"
version = "0.1.0"
edition = "2021"
authors = ["megalodon contributors"]
description = "A blazing-fast, modern Terminal User Interface for Wireshark & tshark"

[dependencies]
ratatui = "0.29.0"
crossterm = "0.28.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
